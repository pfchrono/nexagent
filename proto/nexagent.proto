syntax = "proto3";

package nexagent.v1;

service NexagentService {
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc Inspect(InspectRequest) returns (InspectResponse);
  rpc RunCommand(CommandRequest) returns (CommandResponse);
  rpc RunPrompt(PromptRequest) returns (PromptResponse);
  rpc Stop(StopRequest) returns (StopResponse);
}

message HealthRequest {}

message HealthResponse {
  bool ok = 1;
  string product = 2;
  string session_id = 3;
  string status = 4;
  string detail = 5;
}

message InspectRequest {}

message InspectResponse {
  bool ok = 1;
  string session_json = 2;
}

message CommandRequest {
  string input = 1;
}

message CommandResponse {
  bool ok = 1;
  string output = 2;
  string error = 3;
  string activity = 4;
}

message PromptRequest {
  string prompt = 1;
}

message PromptResponse {
  bool ok = 1;
  string output = 2;
  string error = 3;
  string provider = 4;
  string model = 5;
  string adapter = 6;
  string completion_json = 7;
}

message StopRequest {}

message StopResponse {
  bool ok = 1;
  string message = 2;
}
